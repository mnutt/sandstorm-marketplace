name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  release-cache:
    name: Warm release build cache
    # Tags can restore main's cache, but cannot restore another tag's cache.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev
      # Publishing runs xtask in debug mode and builds the grain in release mode.
      - run: cargo build --locked -p xtask
      - run: cargo build --locked --release -p marketplace-grain

  test:
    name: Rust and browser acceptance tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev bubblewrap
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance
      - name: Build disposable test package
        run: cargo xtask package --test-key --debug --contact-email ci@example.invalid
      - name: Smoke test the packaged runtime
        run: cargo xtask test-package
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
