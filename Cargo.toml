[workspace]
members = [
  "xtask",
  "crates/marketplace-grain",
  "crates/marketplace-model",
  "crates/marketplace-sync",
  "crates/marketplace-web",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.4.1"

[workspace.dependencies]
anyhow = "1.0"
askama = "0.16"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
tokio = { version = "1.46", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# cargo xtask runs in the dev profile, even when packaging a release binary.
[profile.dev.package.lzma-rust2]
opt-level = 3
