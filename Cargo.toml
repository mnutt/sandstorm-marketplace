[workspace]
members = [
  "xtask",
  "crates/marketplace-grain",
  "crates/marketplace-model",
  "crates/marketplace-sync",
  "crates/marketplace-web",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.1"

[workspace.dependencies]
anyhow = "1.0"
askama = "0.14"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
tokio = { version = "1.46", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
